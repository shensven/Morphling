name: Test

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  test:
    # The app uses the macOS 26 SDK
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests
        run: |
          xcodebuild test \
            -project Morphling.xcodeproj \
            -scheme Morphling \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
