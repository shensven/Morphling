name: Test

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  test:
    # The project is saved in the Xcode 27 format, and only this preview
    # image has Xcode 27 installed
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests
        run: |
          xcodebuild test \
            -project Morphling.xcodeproj \
            -scheme Morphling \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
